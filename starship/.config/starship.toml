# REFERENCE:
# https://starship.rs/config/
# https://www.nerdfonts.com/cheat-sheet

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 2000

# Nord: la fuente de verdad es #2E3440 / #D8DEE9 / #88C0D0.

[package]
disabled = true

[directory]
style = "bold #88c0d0"

[git_branch]
style = "bold #d8dee9"
symbol = "󰘬 "

[git_status]
format = '([\[$all_status$ahead_behind \]]($style) )'
ahead = " [](#5e81ac)[$count](#d8dee9)"
behind = " [](#5e81ac)[$count](#d8dee9)"
conflicted = ' [=$count](#ebcb8b)'
deleted = ' [✘$count](#bf616a)'
diverged = " [](#88c0d0)[$ahead_count](#d8dee9)[](#5e81ac)[$behind_count](#d8dee9)"
modified = ' [*$count](#a3be8c)'
renamed = ' [»$count](#b48ead)'
staged = ' [+$count](#a3be8c)'
stashed = ' [\\$$count](#ebcb8b)'
style = "bold #d8dee9"
untracked = " [?$count](#88c0d0)"

[git_commit]
only_detached = true
style = "#4c566a"
format = "[$hash]($style) "

[ruby]
symbol = " "

[nodejs]
symbol = "󰎙 "

[python]
symbol = "󰌠 "

